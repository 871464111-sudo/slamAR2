<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,shrink-to-fit=no" name="viewport" />
    <meta content="IE=edge" http-equiv="X-UA-Compatible" />
    <title>我的IMU辅助平面检测</title>
    <link rel="icon" type="image/png" href="data:image/png;base64,iVBORw0KGgo=">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,
        body {
            font-family: 'Helvetica', sans-serif;
            overflow: hidden;
            background: #000;
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #container {
            position: relative;
            width: 100%;
            height: 100%;
            display: block;
            overflow: hidden;
            line-height: 0;
        }
        #container > * {
            position: absolute;
            display: block;
            user-select: none;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            animation: fadeIn 1.2s;
        }
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
        }
        #container > video {
            object-fit: cover;
            object-position: 50% 50%;
        }
        #splash {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            opacity: 1;
        }
        #overlay {
            position: absolute;
            font-size: 16px;
            z-index: 2;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            background: rgba(0, 0, 0, 0.5);
        }
        #overlay::before {
            position: absolute;
            width: 100%;
            white-space: pre-wrap;
            content: "Please allow access to \A your camera and motion sensor.";
            top: calc(50% + 50px);
            text-align: center;
            color: #949494;
        }
        #overlay button {
            background: transparent;
            border: 1px solid rgb(255, 255, 255);
            border-radius: 4px;
            color: #ffffff;
            padding: 12px 18px;
            text-transform: uppercase;
            cursor: pointer;
        }
        @keyframes fadeIn {
            0% {
                opacity: 0;
            }
            50% {
                opacity: 0.6;
            }
            100% {
                opacity: 1;
            }
        }
        @media screen and (max-device-width: 480px) and (orientation: landscape) {
            #container {
                display: none;
            }
            body::before {
                content: "Rotate device to portrait mode.";
                color: white;
            }
        }
        @media screen and (max-device-width: 480px) and (orientation: portrait) {
            #container {
                display: block;
            }
            body::before {
                content: none;
            }
        }
    </style>
</head>
<body>
<div id="container"></div>
<div id="overlay">
    <button id="start_button">Start</button>
    <div id="splash"></div>
</div>
<!-- 引入GLTF加载器，用来加载你的3D模型 -->
<script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/loaders/GLTFLoader.js"></script>
<script type="module">
    import { Stats } from "./stats.js";
    import { AlvaAR } from './alva_ar.js';
    import { ARCamIMUView } from "./alva_ar_three.js";
    import { IMU } from "./imu.js";
    import { Camera, onFrame, resize2cover } from "./utils.js";
    function main()
    {
        const config = {
            video: {
                facingMode: 'environment',
                aspectRatio: 16 / 9,
                width: { ideal: 1280 }
            },
            audio: false
        }
        const $container = document.getElementById( 'container' );
        const $view = document.createElement( 'div' );
        const $canvas = document.createElement( 'canvas' );
        const $overlay = document.getElementById( 'overlay' );
        const $start = document.getElementById( 'start_button' );
        const $splash = document.getElementById( 'splash' );
        const splashFadeTime = 800;
        $splash.style.transition = `opacity ${ splashFadeTime / 1000 }s ease`;
        $splash.style.opacity = 0;
        async function demo( media, imu )
        {
            const $video = media.el;
            const size = resize2cover( $video.videoWidth, $video.videoHeight, $container.clientWidth, $container.clientHeight );
            $canvas.width = $container.clientWidth;
            $canvas.height = $container.clientHeight;
            $video.style.width = size.width + 'px';
            $video.style.height = size.height + 'px';
            const ctx = $canvas.getContext( '2d', { alpha: false, desynchronized: true } );
            const alva = await AlvaAR.Initialize( $canvas.width, $canvas.height );
            const view = new ARCamIMUView( $view, $canvas.width, $canvas.height );
            
            // 加光照
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            view.scene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
            directionalLight.position.set(0, 1, 0);
            view.scene.add(directionalLight);

            Stats.add( 'total' );
            Stats.add( 'video' );
            Stats.add( 'slam' );
            $container.appendChild( $canvas );
            $container.appendChild( $view );
            document.body.appendChild( Stats.el );

            // 👇 点击屏幕，加载你的模型！
            document.body.addEventListener( "click", ( e ) => {
                // 获取你点击的桌面的位置
                const hitPos = view.getHitPosition(e.clientX, e.clientY);
                if (!hitPos) return;

                // 加载你自己的my-model.glb
                const loader = new GLTFLoader();
                loader.load('./my-model.glb', (gltf) => {
                    const model = gltf.scene;
                    // 把模型放在你点击的位置
                    model.position.copy(hitPos);
                    // 调整模型大小，根据你的模型改这个数值
                    model.scale.set(0.3, 0.3, 0.3);
                    // 加到场景里
                    view.scene.add(model);
                });
            }, false );

            // 双击重置
            document.body.addEventListener( "dblclick", ( e ) => alva.reset(), false );
            
            onFrame( () =>
            {
                Stats.next();
                Stats.start( 'total' );
                ctx.clearRect( 0, 0, $canvas.width, $canvas.height );
                if( !document['hidden'] )
                {
                    Stats.start( 'video' );
                    ctx.drawImage( $video, 0, 0, $video.videoWidth, $video.videoHeight, size.x, size.y, size.width, size.height );
                    const frame = ctx.getImageData( 0, 0, $canvas.width, $canvas.height );
                    Stats.stop( 'video' );
                    Stats.start( 'slam' );
                    // 带IMU的SLAM计算
                    const pose = alva.findCameraPoseWithIMU( frame, imu.orientation, imu.motion );
                    Stats.stop( 'slam' );
                    if( pose )
                    {
                        view.updateCameraPose( pose );
                    }
                    else
                    {
                        view.lostCamera();
                        const dots = alva.getFramePoints();
                        for( const p of dots )
                        {
                            ctx.fillStyle = 'white';
                            ctx.fillRect( p.x, p.y, 2, 2 );
                        }
                    }
                }
                Stats.stop( 'total' );
                Stats.render();
                return true;
            }, 30 );
        }
        setTimeout( () =>
        {
            $splash.remove();
            $start.addEventListener( 'click', async () =>
            {
                try
                {
                    $overlay.remove();
                    const imu = await IMU.Initialize();
                    const cam = await Camera.Initialize( config );
                    await demo( cam, imu );
                } catch( error )
                {
                    alert( 'Error: ' + error );
                }
            }, { once: true } );
        }, splashFadeTime );
    }
    window.addEventListener( 'load', main );
</script>
</body>
</html>
